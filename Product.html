<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Donation | Products</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f3f3f3;
    }

    nav {
      background-color: #2e8b57;
      padding: 15px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      width: 90%;
      max-width: 800px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      color: #2e8b57;
    }

    .product-item {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      background: #fafafa;
    }

    .product-item img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .product-item button {
      background-color: #ff6347;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
    }

    .product-item button:hover {
      background-color: #d94c32;
    }

    .collected {
      background-color: gray !important;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">🏠 Home</a>
    <a href="products.html">📦 Products</a>
  </nav>

  <div class="container">
    <h1>Available Products</h1>
    <div id="productList"></div>
  </div>

  <script>
    const productList = document.getElementById("productList");

    function loadProducts() {
      const products = JSON.parse(localStorage.getItem("products")) || [];

      if (products.length === 0) {
        productList.innerHTML = "<p>No donated products yet.</p>";
        return;
      }

      productList.innerHTML = "";
      products.forEach((item, index) => {
        const div = document.createElement("div");
        div.classList.add("product-item");

        div.innerHTML = `
          <img src="${item.image}" alt="Product Image">
          <h3>${item.name}</h3>
          <p><strong>Description:</strong> ${item.desc}</p>
          <p><strong>Address:</strong> ${item.address}</p>
          <p><strong>Contact:</strong> ${item.contact}</p>
          <button class="collectBtn" ${item.collected ? 'disabled class="collected"' : ''}>
            ${item.collected ? 'Collected ✅' : 'Mark as Collected'}
          </button>
        `;

        const btn = div.querySelector(".collectBtn");
        btn.onclick = function() {
          products[index].collected = true;
          localStorage.setItem("products", JSON.stringify(products));
          loadProducts(); // refresh list
        };

        productList.appendChild(div);
      });
    }

    loadProducts();
  </script>
</body>
</html>
